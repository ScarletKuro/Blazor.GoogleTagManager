name: continuous

on:
  push:

jobs:
  build:
    name: Build and pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            src/**/*.csproj
            tests/**/*.csproj
            version.json

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore
        run: dotnet restore Blazor.GoogleTagManager.slnx

      - name: Run Bun tests with coverage
        working-directory: src/Blazor.GoogleTagManager
        run: bun test --coverage --coverage-reporter=text --coverage-reporter=lcov --coverage-dir ../../artifacts/coverage/bun ./assets/GoogleTagManager.test.ts

      - name: Build
        run: dotnet build Blazor.GoogleTagManager.slnx -c Release --no-restore

      - name: Verify generated JS bundle is committed
        run: git diff --exit-code -- src/Blazor.GoogleTagManager/wwwroot/GoogleTagManager.js

      - name: Build smoke tests
        run: dotnet build tests/Blazor.GoogleTagManager.SmokeTests/Blazor.GoogleTagManager.SmokeTests.csproj -c Release

      - name: Install Playwright browsers
        shell: pwsh
        run: tests/Blazor.GoogleTagManager.SmokeTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run smoke tests with coverage
        run: >
          dotnet test tests/Blazor.GoogleTagManager.SmokeTests/Blazor.GoogleTagManager.SmokeTests.csproj
          -c Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/coverage/dotnet
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload Bun coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: artifacts/coverage/bun/lcov.info
          flags: bun
          fail_ci_if_error: true

      - name: Upload .NET coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: artifacts/coverage/dotnet
          flags: dotnet
          fail_ci_if_error: true

      - name: Pack
        run: dotnet pack src/Blazor.GoogleTagManager/Blazor.GoogleTagManager.csproj -c Release --no-build -o artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages
