name: release

on:
  push:
    tags:
      - '*'

jobs:
  publish:
    name: Publish release packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} is not a release tag in X.Y.Z form."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            src/**/*.csproj
            version.json

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore
        run: dotnet restore Blazor.GoogleTagManager.slnx

      - name: Run Bun tests
        working-directory: src/Blazor.GoogleTagManager
        run: bun test ./assets/GoogleTagManager.test.ts

      - name: Build
        run: dotnet build Blazor.GoogleTagManager.slnx -c Release --no-restore

      - name: Build smoke tests
        run: dotnet build tests/Blazor.GoogleTagManager.SmokeTests/Blazor.GoogleTagManager.SmokeTests.csproj -c Release

      - name: Install Playwright browsers
        shell: pwsh
        run: tests/Blazor.GoogleTagManager.SmokeTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run smoke tests
        run: dotnet test tests/Blazor.GoogleTagManager.SmokeTests/Blazor.GoogleTagManager.SmokeTests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack src/Blazor.GoogleTagManager/Blazor.GoogleTagManager.csproj -c Release --no-build -o artifacts/packages

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        shell: bash
        run: dotnet nuget push "artifacts/packages/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate

      - name: Publish to GitHub Packages
        shell: bash
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key "${{ secrets.GITHUB_TOKEN }}" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages
