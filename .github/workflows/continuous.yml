name: continuous

on:
  push:

jobs:
  build:
    name: Build and pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            src/**/*.csproj
            version.json

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore
        run: dotnet restore src/Blazor.GoogleTagManager.slnx

      - name: Run Bun tests
        working-directory: src/Blazor.GoogleTagManager
        run: bun test ./assets/GoogleTagManager.test.ts

      - name: Build
        run: dotnet build src/Blazor.GoogleTagManager.slnx -c Release --no-restore

      - name: Pack
        run: dotnet pack src/Blazor.GoogleTagManager/Blazor.GoogleTagManager.csproj -c Release --no-build -o artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages
